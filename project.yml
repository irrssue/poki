name: Poki
options:
  bundleIdPrefix: com.pokiapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Poki:
    type: application
    platform: iOS
    sources:
      - path: ios/Poki
    dependencies:
      - package: PokiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokiapp.Poki
        INFOPLIST_KEY_CFBundleDisplayName: Poki
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PokiTests
  PokiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/PokiTests
    dependencies:
      - target: Poki
      - package: PokiCore
packages:
  PokiCore:
    path: ios/Packages/PokiCore

