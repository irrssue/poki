name: Poki
options:
  bundleIdPrefix: com.pokiapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Poki:
    type: application
    platform: iOS
    sources:
      - path: ios/Poki
    info:
      path: ios/Poki/Resources/Info.plist
      properties:
        PokiAPNSEnvironment: "$(POKI_APNS_ENVIRONMENT)"
    entitlements:
      path: ios/Poki/Resources/Poki.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: PokiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pokiapp.Poki
        DEVELOPMENT_TEAM: S9ZZCZZ5BV
        INFOPLIST_KEY_CFBundleDisplayName: Poki
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          APS_ENVIRONMENT: development
          POKI_APNS_ENVIRONMENT: sandbox
        Release:
          APS_ENVIRONMENT: production
          POKI_APNS_ENVIRONMENT: production
    scheme:
      testTargets:
        - PokiTests
  PokiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/PokiTests
    dependencies:
      - target: Poki
      - package: PokiCore
packages:
  PokiCore:
    path: ios/Packages/PokiCore
